<title>11번가 탭바 프로토타입 B</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --ease: cubic-bezier(.65,0,.35,1); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#1c1c1e; overflow:hidden;
    font-family:"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .phone { position:relative; width:375px; height:812px; background:#fff; overflow:hidden;
    border-radius:36px; box-shadow:0 20px 60px rgba(0,0,0,.5); transform-origin:center center; }

  .screen { position:absolute; inset:0; background:#fff; transition:transform .38s var(--ease); }
  .screen.hidden { visibility:hidden; pointer-events:none; }
  /* 화면 전환: PDP는 오른쪽에서 밀려 들어오고(push), 뒤로 가면 다시 오른쪽으로 빠짐(pop) */
  .screen.push-in  { transform:translateX(100%); }
  .screen.push-out { transform:translateX(-28%); }
  .scroll { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .content { position:relative; width:375px; background:#fff; }
  .content img.sec { position:absolute; left:0; width:375px; display:block; user-select:none; -webkit-user-drag:none; }
  .fix { position:absolute; left:0; width:375px; display:block; pointer-events:none; user-select:none; -webkit-user-drag:none; }

  /* ---------- 타이틀배너 장식 (Figma 로고데이영역 42:11335, cropSize 27.5,102 320x54 안에서 잘림) ----------
     산타·루돌프: 줄에 매달린 채 위아래로 통통 (줄 윗부분은 배너 위로 잘려 있어서 같이 움직여도 끊겨 보이지 않음)
     반짝이: 별은 커졌다 작아지며 반짝, 동그란 빛망울은 은은하게 깜빡 */
  .deco { position:absolute; left:27.5px; top:96px; width:320px; height:54px; overflow:hidden; pointer-events:none; }
  .deco img, .deco .hang, .deco .bit, .deco svg { position:absolute; display:block; }
  .hang { left:0; top:0; width:0; height:0; animation: hop 1.9s infinite; }
  .hang.rudolph { animation-delay:.32s; }
  @keyframes hop {
    0%   { transform:translateY(0);      animation-timing-function:cubic-bezier(.2,.7,.4,1); }
    11%  { transform:translateY(-3.5px); animation-timing-function:cubic-bezier(.6,0,.8,.5); }
    22%  { transform:translateY(0);      animation-timing-function:cubic-bezier(.2,.7,.4,1); }
    30%  { transform:translateY(-1.5px); animation-timing-function:cubic-bezier(.6,0,.8,.5); }
    38%  { transform:translateY(0); }
    100% { transform:translateY(0); }
  }
  .sparkle .star, .sparkle .glow { transform-box:fill-box; transform-origin:center; }
  .sparkle .star { animation: twinkle 1.6s ease-in-out infinite; }
  .sparkle .glow { animation: glimmer 2.4s ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { transform:scale(.55) rotate(0deg); opacity:.45; }
    45%      { transform:scale(1.15) rotate(12deg); opacity:1; }
    60%      { transform:scale(1) rotate(10deg); opacity:1; }
  }
  @keyframes glimmer {
    0%, 100% { opacity:.12; transform:scale(.85); }
    50%      { opacity:.5; transform:scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) { .hang, .sparkle * { animation:none !important; } }
  /* 화장품(자음생, Figma 55:51915): 5초마다 배너 아래에서 위로 띠옹~ 올라옴. 형태 변형 없이 위치만
     한 주기 5s = 띠옹 등장(~1s) → 제자리 대기 → 끝에서 아래로 쏙 내려감(.36s) → 다시 띠옹 */
  .deco .cosmetic { left:229.42px; top:-2.97px; width:51.47px; height:60.99px;
    animation: rise-pop 5s linear .45s infinite both; }
  @keyframes rise-pop {
    0%    { transform:translateY(62px);  animation-timing-function:cubic-bezier(.2,.7,.3,1); }
    7.6%  { transform:translateY(-5px);  animation-timing-function:cubic-bezier(.5,0,.6,1); }
    10.6% { transform:translateY(1.8px); animation-timing-function:ease-out; }
    13.3% { transform:translateY(-1.4px);  animation-timing-function:ease-in-out; }
    16%   { transform:translateY(.4px);  animation-timing-function:ease-in-out; }
    19%   { transform:translateY(0); }
    92.8% { transform:translateY(0);     animation-timing-function:cubic-bezier(.5,0,.9,.6); }
    100%  { transform:translateY(62px); }
  }
  @media (prefers-reduced-motion: reduce) { .deco .cosmetic { animation:none; } }

  /* ---------- 상단 고정 레이어 ----------
     상태바: 분홍 헤더 위에서는 분홍(흰 글자), 흰 탭 시트가 올라오면 흰색(검은 글자)으로 바뀜
     카테고리 탭: 스크롤로 상태바 바로 아래(y44)에 닿으면 그 자리에 고정 (Figma 스크롤 후 홈 86:64817) */
  .status { top:0; height:44px; z-index:30; }
  .status.white { opacity:0; }
  .tabs-sticky { top:44px; height:49px; z-index:20; visibility:hidden; }
  .stuck .tabs-sticky { visibility:visible; }

  /* ---------- floating_text 띠배너 (Figma 88:66423, 375x40, y93) ----------
     탭이 고정되면 탭 뒤에서 아래로 스르륵 내려오고, 자리 잡은 뒤 문구가 왼쪽으로 계속 흐르고, 배경 그라데이션도 천천히 흐름 */
  .ft { position:absolute; left:0; top:93px; width:375px; height:40px; z-index:15; overflow:hidden;
    background: linear-gradient(90deg, #d0f2ff 0%, #f9ffb7 26.44%, #fbebff 50%, #f9ffb7 73.56%, #d0f2ff 100%) 0 0 / 750px 100% repeat-x;
    box-shadow: 0 0 1px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.06);
    animation: ft-bg 9s linear infinite;
    transform: translateY(-40px); opacity:0; visibility:hidden; pointer-events:none;
    /* 사라질 때: 잔상 없이 빠르게 (위로 살짝 + 페이드 .16s) */
    transition: transform .16s cubic-bezier(.4,0,1,1), opacity .12s ease-in, visibility 0s linear .16s; }
  .ft.on { transform:none; opacity:1; visibility:visible; pointer-events:auto;
    transition: transform .5s cubic-bezier(.22,1,.36,1), opacity .2s ease, visibility 0s; }
  @keyframes ft-bg { to { background-position: -750px 0; } }
  /* 문구 영역: 문구 시작 x12 ~ 345.8 (Figma 마스크: 오른쪽 287~345.8에서 투명해짐).
     흐를 때 왼쪽 끝도 x2~12에서 살짝 페이드 → 멈춰 있을 땐 첫 글자가 x12에 또렷하게 */
  .ft-clip { position:absolute; left:2px; top:10px; width:343.8px; height:20px; overflow:hidden; padding-left:10px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 285.25px, transparent 343.8px);
            mask-image: linear-gradient(90deg, transparent 0, #000 10px, #000 285.25px, transparent 343.8px); }
  .ft-track { display:flex; width:max-content; white-space:nowrap; will-change:transform; }
  /* 배너가 먼저 내려와 자리 잡은 뒤(.6s) 문구가 왼쪽으로 흐르기 시작. 배너가 사라지면 처음 위치로 되돌아감 */
  .ft.on .ft-track { animation: ft-flow var(--flow, 12s) linear .6s infinite; }
  .ft-track span.copy { padding-right:28px; font-size:14px; line-height:20px; color:#111; letter-spacing:0; font-weight:400; }
  .ft-track b { font-weight:600; }
  .ft-track .red { color:#ff0038; }
  @keyframes ft-flow { to { transform: translateX(-50%); } }
  .ft-close { position:absolute; left:340px; top:7.5px; width:25px; height:25px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; border-radius:50%; }
  .ft-close:active { background:rgba(0,0,0,.06); }
  @media (prefers-reduced-motion: reduce) { .ft, .ft-track { animation:none; } }

  /* ---------- 탭바 (흰색 solid) ---------- */
  .tabs { position:absolute; left:0; bottom:0; width:375px; height:226px; z-index:40; pointer-events:none; }
  .tab { position:absolute; inset:0; pointer-events:none; }
  .tab img { display:block; user-select:none; -webkit-user-drag:none; }
  /* Figma B안 탭바: fill #FFF 95% (맨 위로 버튼만 100%), drop shadow 0 1 3 #000 10% (탭 pill radius 100, 맨 위로 버튼 44x44 radius 20) */
  .bar { position:absolute; border-radius:100px; background:rgba(255,255,255,.95); box-shadow:0 1px 3px rgba(0,0,0,.10); }
  .bar.top-btn { border-radius:20px; background:#fff; }
  .bar .items { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .bar .items img { height:auto; }

  /* 탭바 전환: 화면이 바뀌면 이전 탭바는 페이드, 새 탭바는 젤리를 눌렀다 놓은 느낌으로 띠옹 (A안과 같은 모션) */
  .tab > * { transition: opacity .3s var(--ease); }
  .tab.off > * { opacity:0; }
  .tab.off .hot { pointer-events:none; }
  @keyframes jelly-pop-up {
    0%   { opacity:0; transform: scale(1.04, .9);  }
    18%  { opacity:1; transform: scale(1.04, .9);  animation-timing-function: cubic-bezier(.3,1.4,.5,1); }
    62%  {            transform: scale(.99, 1.02); animation-timing-function: ease-out; }
    100% {            transform: scale(1, 1); }
  }
  .tab.pop > * { animation: jelly-pop-up .5s backwards; animation-delay: calc(140ms + var(--i, 0) * 60ms); transform-origin:50% 100%; }
  @media (prefers-reduced-motion: reduce) { .tab.pop > * { animation:none; } .screen { transition:none; } }

  /* PDP 하단 구매 바 (Figma 55:51939): #FF0038 90%, radius 100, shadow 0 1 6 #000 10% */
  .buy { position:absolute; display:flex; align-items:center; border-radius:100px; background:rgba(255,0,56,.9);
    box-shadow:0 1px 6px rgba(0,0,0,.10); color:#fff; font-weight:700; white-space:nowrap; }
  .buy .seg { height:56px; display:flex; align-items:center; justify-content:center; flex:none; }
  .buy .seg img { width:22px; height:22px; display:block; }
  .buy .s13 { font-size:13px; line-height:19px; }
  .buy .s18 { font-size:18px; line-height:21px; }
  .buy .div { width:1px; height:20px; background:rgba(255,255,255,.4); flex:none; }

  /* PDP GNB 알약 바 (Figma 42:11813): 흰색 90%, radius 100, 아래 테두리 #eee, shadow 0 0 .5 28% + 0 2 3 6% */
  .pdp-nav { position:absolute; inset:0 0 auto 0; height:110px; z-index:35; pointer-events:none; visibility:hidden; }
  .pdp-nav.on { visibility:visible; }
  .pdp-nav .hot { pointer-events:auto; }
  .pdp-gnb { position:absolute; left:16px; top:44px; width:343px; height:58px; pointer-events:none;
    display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-radius:100px; }
  /* 알약 바탕은 따로 두어 전환 중 투명도만 바꿈: 평소 흰색 90% */
  .pdp-gnb .pill-bg { position:absolute; inset:0; border-radius:inherit; background:#fff; opacity:.9;
    border-bottom:1px solid #eee; box-shadow:0 0 .5px rgba(0,0,0,.28), 0 2px 3px rgba(0,0,0,.06); }
  .pdp-gnb > .grp { position:relative; }
  .pdp-gnb .g-logo { transform-origin:0 0; }

  /* 공유 이미지(히어로): 홈 썸네일 109x109 r4 ↔ PDP 대표 이미지 300x300 r12 */
  .hero { position:absolute; z-index:30; overflow:hidden; display:none; pointer-events:none; background:#f8f8fa; }
  .hero img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .pdp-gnb .grp { display:flex; align-items:center; gap:10px; }
  .pdp-gnb .grp.g8 { gap:8px; }
  .pdp-gnb img { display:block; }
  .pdp-gnb .vdiv { width:1px; height:20px; background:#ddd; }
  .pdp-gnb .ttl { font-size:18px; line-height:21px; font-weight:700; color:#111; }
  .pdp-gnb .cart { position:relative; width:36px; height:36px; }
  .pdp-gnb .cart img { position:absolute; }
  .pdp-gnb .badge { position:absolute; left:23px; top:-2px; width:16px; height:16px; border-radius:50%; background:#ff0038;
    color:#fff; font-size:11px; line-height:16px; text-align:center; }

  .hot { position:absolute; pointer-events:auto; cursor:pointer; border-radius:12px; }
  .hot:active { background:rgba(0,0,0,.06); }
  /* 탭바 아이콘 눌림: 아이콘만 감싸는 원 */
  .tab .hot.slot:active { background:none; }
  /* 탭 칸 눌림: 아이콘과 텍스트를 함께 감싸는 둥근 캡슐 (칸 68.6x56 안쪽 61x50, 다섯 칸 모두 같은 모양) */
  .tab .hot.slot::before { content:""; position:absolute; left:50%; top:50%; width:61px; height:50px;
    margin:-25px 0 0 -30.5px; border-radius:25px; background:rgba(0,0,0,.07);
    opacity:0; transform:scale(.88); transition: opacity .18s ease, transform .22s var(--ease); }
  .tab .hot.slot:active::before { opacity:1; transform:scale(1); transition-duration:.08s, .12s; }
  /* 7칸 탭바(칸 49px)는 캡슐도 좁게 */
  .tab .hot.slot.s7::before { width:47px; margin-left:-23.5px; }
  /* 나의11번가 GNB 알약 (Figma 111:96995): 16,44 343x52, 흰색 95%, radius 100, shadow 0 1 5 5% + 0 0 1 10%
     화면 밖(phone) 레이어라서 홈 GNB 알약과 같은 자리에서 요소만 바뀌며 이어짐 */
  .my-nav { position:absolute; left:16px; top:44px; width:343px; height:52px; z-index:36; pointer-events:none; visibility:hidden; }
  .my-nav.on { visibility:visible; }
  .my-nav .mn-bg { position:absolute; inset:0; border-radius:100px; background:#fff; opacity:.95;
    box-shadow:0 1px 5px rgba(0,0,0,.05), 0 0 1px rgba(0,0,0,.10); }
  .my-nav img { position:absolute; display:block; user-select:none; -webkit-user-drag:none; }
  .my-nav .h-only { opacity:0; }
  .my-nav .mn-logo { transform-origin:0 0; }
  .my-nav .mn-hsearch { transform-origin:100% 50%; }
  .my-nav .hot { pointer-events:auto; }
  body.debug .hot, body.debug .ft-close { outline:2px dashed rgba(255,0,56,.8); }

  /* ---------- 탭바 알약 (Figma B안 홈 탭바 130:102164 · 나의11번가 134:103166) ----------
     왼쪽 = 그라데이션 알약 버튼(AI 맞춤검색 / 11번가+ 구매미션), 오른쪽 = 흰 알약, 맨 위로 = 원.
     Figma glass + drop shadow 0 1 5 #000 5% + 0 0 1 #000 10% → 흰 바탕 + 그림자로 표현 */
  .bar.solid { background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.05), 0 0 1px rgba(0,0,0,.10); }
  .bar.top-btn.round { border-radius:50%; }
  .pill { position:absolute; height:52px; border-radius:26px; box-shadow:0 1px 5px rgba(0,0,0,.05), 0 0 1px rgba(0,0,0,.10); pointer-events:none; }
  .pill img { display:block; width:100%; height:100%; border-radius:26px; }
  .pill.press { transform:scale(.95); transition:transform .12s ease-out; }
  .pill { transition:transform .3s cubic-bezier(.3,1.6,.5,1); }
  .aib.gone, .pill.gone { visibility:hidden; }
  /* AI 캐릭터: 2.8초마다 몸통이 통통 한 번 튀며(눌렸다 늘어남) 안의 흰 반짝이가 반짝, 오른쪽 위 작은 별은 살짝 늦게 반짝 */
  .aic { position:absolute; left:14.5px; top:14.25px; overflow:visible; }
  .aic-body, .aic-spark, .aic-star { transform-box:fill-box; }
  .aic-body  { transform-origin:50% 100%; animation: aic-hop 2.8s cubic-bezier(.3,.7,.4,1) infinite; }
  .aic-spark { transform-origin:50% 50%; animation: aic-spark 2.8s ease-in-out infinite; }
  .aic-star  { transform-origin:50% 50%; animation: aic-star 2.8s ease-in-out infinite; }
  @keyframes aic-hop {
    0%, 52%, 100% { transform:none; }
    58% { transform:scale(1.08, .9); }
    68% { transform:translateY(-2.2px) scale(.95, 1.06); }
    78% { transform:translateY(0) scale(1.04, .96); }
    86% { transform:none; }
  }
  @keyframes aic-spark {
    0%, 60% { transform:none; opacity:1; }
    66% { transform:scale(.55) rotate(0deg); opacity:.7; }
    76% { transform:scale(1.25) rotate(90deg); opacity:1; }
    86%, 100% { transform:scale(1) rotate(90deg); opacity:1; }   /* 네 갈래 별이라 90° 돌아도 처음 모양과 같음 → 반복 이음새 없음 */
  }
  @keyframes aic-star {
    0%, 66% { transform:none; opacity:.9; }
    74% { transform:scale(.5) rotate(20deg); opacity:.35; }
    84% { transform:scale(1.25) rotate(70deg); opacity:1; }
    92%, 100% { transform:scale(1) rotate(90deg); opacity:.9; }
  }
  @media (prefers-reduced-motion: reduce) { .aic-body, .aic-spark, .aic-star { animation:none; } }
  /* 11번가플러스 로고: 3.2초마다 가는 빛이 왼→오로 반짝 스치고, 지나간 직후 + 칸의 + 가 살짝 비틀며 톡 커졌다 돌아옴 */
  .mpl { position:absolute; left:9.5px; top:19.47px; overflow:hidden; }
  /* 빛: 얇은 심(1.2px, 최대 55%) + 은은한 번짐(6px, overlay로 바탕색을 밝힘). 빠르게 스치며 들어올 때·나갈 때 흐려짐 */
  .mpl-shine { animation: mpl-shine 3.2s cubic-bezier(.5,0,.3,1) infinite; }
  .mpl-glow { mix-blend-mode:overlay; }
  .mpl-plus { transform-box:fill-box; transform-origin:50% 50%; animation: mpl-plus 3.2s ease-in-out infinite; }
  @keyframes mpl-shine {
    0%, 52% { transform:skewX(-22deg) translateX(0); opacity:0; }
    56% { opacity:1; }
    68% { opacity:1; }
    74%, 100% { transform:skewX(-22deg) translateX(50px); opacity:0; }
  }
  @keyframes mpl-plus {
    0%, 70% { transform:none; }
    77% { transform:scale(.72) rotate(-14deg); }
    86% { transform:scale(1.28) rotate(10deg); }
    93% { transform:scale(.94) rotate(-3deg); }
    100% { transform:none; }
  }
  @media (prefers-reduced-motion: reduce) { .mpl-shine, .mpl-plus { animation:none; } .mpl-shine { display:none; } }
  .tab .hot.ai-hot:active { background:none; }

  /* ---------- AI검색 바텀시트 ---------- */
  .ai { position:absolute; inset:0; z-index:45; pointer-events:none; visibility:hidden; }
  .ai.on { visibility:visible; }
  .ai.open { pointer-events:auto; }
  .ai-catch { position:absolute; inset:0; }
  .ai-move { position:absolute; inset:0; pointer-events:none; }
  .ai-move > * { pointer-events:auto; }
  /* 시트 몸통 = 알약이 그대로 늘어나 시트가 됨. 최종: 0,533.5 375x278.5, 위 모서리 12 (드래그 핸들 그림자 0 0 8 2 15%) */
  .ai-blob { position:absolute; left:0; top:533.5px; width:375px; height:278.5px; overflow:hidden;
    border-radius:12px 12px 0 0; background:#faf7ff; box-shadow:0 0 8px 2px rgba(0,0,0,.15); }
  .ai-bg { position:absolute; left:0; top:0; width:375px; height:278.5px; display:block; }
  /* 잉크: AI 맞춤검색 알약의 연보라→하늘 그라데이션(#F6E0FF→#E2F3FF)이 알약 자리(시트 기준 17,210.5 117x52)에서 번져 나감 */
  .ai-ink { position:absolute; inset:0; opacity:0;

              <path d="M29.9708 7.40515L29.0996 6.53394L29.9708 5.66272H32.3231C32.5156 5.66272 32.6716 5.81867 32.6716 6.01121V7.05667C32.6716 7.2492 32.5156 7.40515 32.3231 7.40515H29.9708Z" fill="url(#mplA)"/>

  <!-- AI검색 바텀시트 (Figma 111:93087, 375x284, 화면 아래에 붙음)

        <img class="ai-c" src="img/ai/s_chip1.png"  style="left:16px;top:69.5px;width:269px" alt="">

<div class="hint">GNB·탭바 아이디에이션 프로토타입 · 홈을 아래로 스크롤하면 띠배너가 나타나요<br><kbd>H</kbd> 핫스팟 보기 · <kbd>←</kbd> 뒤로</div>

<script>
(() => {
  const TAB_SPACE = 110;
  const phone = document.getElementById('phone');
  const scroll = document.querySelector('#home .scroll');
  const byId = id => document.getElementById(id);
  const scrollOf = id => byId(id).querySelector('.scroll');

  /* ---------- 스크롤 영역 높이 ---------- */
  function layout(sc) {
    const c = sc.querySelector('.content');
    let bottom = 0;
    c.querySelectorAll('img.sec').forEach(img => {
      if (img.naturalHeight) bottom = Math.max(bottom, img.offsetTop + img.naturalHeight / 2);
    });
    c.style.height = (Math.max(bottom, 812) + TAB_SPACE) + 'px';
  }
  document.querySelectorAll('.scroll').forEach(sc => {
    sc.querySelectorAll('img.sec').forEach(img => img.complete ? layout(sc) : img.addEventListener('load', () => layout(sc)));
    layout(sc);
  });

  function fit() {
    const s = innerWidth <= 500 ? Math.min(innerWidth/375, innerHeight/812)
                                : Math.min(1, (innerHeight - 32) / 812, (innerWidth - 16) / 375);
    phone.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* ---------- 스크롤: 탭 고정 + 띠배너 ----------
     카테고리 탭(콘텐츠 y150)이 상태바 아래(y44)에 닿는 지점 = 106px 스크롤 */
  const STICK = 106;
  const statusWhite = document.getElementById('statusWhite');
  const ft = document.getElementById('ft');
  let ftClosed = false;
  function onScroll() {
    const top = Math.max(scroll.scrollTop, 0);
    // 흰 시트 윗부분(y≈150)이 상태바에 다가오면 상태바가 흰색으로
    statusWhite.style.opacity = Math.min(Math.max((top - 92) / 10, 0), 1);
    const stuck = top >= STICK;
    phone.classList.toggle('stuck', stuck);
    if (!stuck) ftClosed = false;                 // 헤더가 다시 보이면 닫았던 배너도 다음에 다시 나옴
    ft.classList.toggle('on', stuck && !ftClosed);
  }
  scroll.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
  document.getElementById('ftClose').addEventListener('click', () => { ftClosed = true; ft.classList.remove('on'); });

  // 문구 흐르는 속도: 초당 약 36px
  const track = document.getElementById('ftTrack');
  const setFlow = () => track.style.setProperty('--flow', (track.scrollWidth / 2 / 36).toFixed(2) + 's');
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(setFlow); setFlow();

  /* ---------- 화면 전환: 홈 ↔ PDP ---------- */
  let current = 'home';
  const stack = [];
  function setTab(screen) {
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.screen === screen;
      t.classList.remove('pop');
      if (on) {
        [...t.children].forEach((c, i) => c.style.setProperty('--i', c.classList.contains('hot') ? 0 : i));
        t.getBoundingClientRect();
        t.classList.add('pop');
      }
      t.classList.toggle('off', !on);
    });
  }
  /* ---------- 홈 ↔ PDP: 공유 이미지 전환 ----------
     열기: 비비고 썸네일(109x109)이 PDP 대표 이미지(300x300) 자리로 커지고, PDP 화면은 썸네일 자리에서부터 펼쳐짐
     닫기: 반대로 대표 이미지가 썸네일 자리로 작아지며 PDP가 그 안으로 접혀 들어감 */
  const EASE = 'cubic-bezier(.32,.72,0,1)', DUR = 560;
  const hero = byId('hero'), heroThumb = hero.querySelector('.h-thumb');
  const pdpNav = byId('pdpNav'), pill = byId('pdpGnb'), pillBg = pill.querySelector('.pill-bg');
  const g = sel => pill.querySelector(sel);
  const CARD = { x:133, y:1214, w:109, h:109, r:4 };   // 홈 콘텐츠 좌표
  const MAIN = { x:16,  y:118,  w:300, h:300, r:12 };  // PDP 콘텐츠 좌표(스크롤 0 기준)
  const FULL = { x:0, y:0, w:375, h:812 };
  let busy = false;
  const cardRect = () => ({ ...CARD, y: CARD.y - scrollOf('home').scrollTop });
  const mainRect = () => ({ ...MAIN, y: MAIN.y - scrollOf('pdp').scrollTop });
  const inset = (r, R) => `inset(${r.y}px ${375 - r.x - r.w}px ${812 - r.y - r.h}px ${r.x}px round ${R}px)`;
  const box = r => ({ left:r.x + 'px', top:r.y + 'px', width:r.w + 'px', height:r.h + 'px', borderRadius:r.r + 'px' });
  const clearAnims = el => el.getAnimations({ subtree:true }).forEach(a => a.cancel());

  function heroMove(from, to, grow) {
    clearAnims(hero);
    hero.style.display = 'block';
    const a = hero.animate([box(from), box(to)], { duration:DUR, easing:EASE, fill:'forwards' });
    // 작은 썸네일 그림 ↔ 큰 대표 이미지 그림을 이동 중에 교차
    heroThumb.animate([{ opacity: grow ? 1 : 0 }, { opacity: grow ? 0 : 1 }],
      { duration: DUR * .55, delay: grow ? 40 : DUR * .4, easing:'ease', fill:'both' });
    return a.finished.then(() => { hero.style.display = 'none'; clearAnims(hero); });
  }

  /* GNB 연결 모션 (홈 상단 상태에 따라)
     - 'pill'  : 홈 GNB 알약(검색바)이 보이는 상태 → 같은 알약이 PDP GNB로 변신 (장바구니 그대로, 로고는 작아지며 비켜섬)
     - 'sticky': 카테고리 탭(+띠배너)이 상단에 고정된 상태 → 그 흰 영역이 그대로 오므라들며 PDP 알약 바가 됨
     - 'drop'  : 그 밖 → PDP GNB가 위에서 톡 내려옴 */
  const HOME_LOGO = 'translate(-46px,-1.74px) scale(1.1818)';   // 홈 로고 52x22.3 @(16,17.86) ↔ PDP 로고 44x18.9 @(62,19.6)
  const ITEMS = ['.g-back', '.g-logo', '.g-title', '.g-search', '.g-cart'];
  function homeTopState() {
    const hs = scrollOf('home').scrollTop;
    if (hs < 50) return { mode:'pill', y:44 - hs };
    if (hs >= STICK) return { mode:'sticky', h: ft.classList.contains('on') ? 89 : 49 };   // 탭 49 + 띠배너 40
    return { mode:'drop' };
  }
  // 고정 탭 영역(0,44 375xh, 각진 사각형) ↔ PDP 알약(16,44 343x58, 둥근)
  const stickyBg = h => ({ top:'0px', left:'-16px', right:'-16px', bottom:(58 - h) + 'px', borderRadius:'0px' });
  const pillBox  = { top:'0px', left:'0px', right:'0px', bottom:'0px', borderRadius:'100px' };
  function gnbIn(st) {
    clearAnims(pdpNav);
    pdpNav.classList.add('on');
    const o = { duration:DUR, easing:EASE, fill:'both' };
    pdpNav.querySelector('.pdp-status').animate([{ opacity:0 }, { opacity:1 }], { duration:DUR * .6, fill:'both' });
    if (st.mode === 'pill') {
      pill.animate([{ transform:`translateY(${st.y - 44}px)` }, { transform:'none' }], o);
      pillBg.animate([{ opacity:0, easing:'ease-out' }, { opacity:1, offset:.22, easing:EASE }, { opacity:.9 }], { ...o, easing:'linear' });
      g('.g-logo').animate([{ transform:HOME_LOGO }, { transform:'none' }], o);
      g('.g-back').animate([{ opacity:0, transform:'translateX(-14px)' }, { opacity:1, transform:'none' }], { ...o, delay:90 });
      g('.g-title').animate([{ opacity:0, transform:'translateX(12px)' }, { opacity:1, transform:'none' }], { ...o, delay:130 });
      g('.g-search').animate([{ opacity:0, transform:'scale(.6)' }, { opacity:1, transform:'none' }], { ...o, delay:150 });
    } else if (st.mode === 'sticky') {
      // 흰 탭 영역이 먼저 덮이고(탭·띠배너 글자가 흰색 아래로 사라짐) → 알약 모양으로 오므라듦 → 그 안에 GNB 요소가 차례로 들어옴
      // 단계별 타이밍: 0~20% 흰색으로 덮기(ease-out) → 20~100% 알약으로 오므라들기(EASE)
      pillBg.animate([{ ...stickyBg(st.h), opacity:0, boxShadow:'none', easing:'ease-out' },
        { ...stickyBg(st.h), opacity:1, offset:.2, boxShadow:'none', easing:EASE },
        { ...pillBox, opacity:.9 }], { duration:DUR * 1.1, fill:'both', easing:'linear' });
      ITEMS.forEach((sel, i) => g(sel).animate([{ opacity:0, transform:'translateY(6px)' }, { opacity:1, transform:'none' }],
        { duration:DUR * .8, delay:DUR * .38 + i * 40, easing:EASE, fill:'both' }));
    } else {
      pill.animate([{ transform:'translateY(-96px)' }, { transform:'translateY(5px)', offset:.55 },
        { transform:'translateY(-2px)', offset:.78 }, { transform:'none' }],
        { duration:640, delay:80, easing:'cubic-bezier(.2,.7,.3,1)', fill:'both' });
    }
  }
  function gnbOut(st) {
    clearAnims(pdpNav);
    const o = { duration:DUR, easing:EASE, fill:'forwards' };
    const out = { duration:DUR * .4, easing:'ease-in', fill:'forwards' };
    pdpNav.querySelector('.pdp-status').animate([{ opacity:1 }, { opacity:0 }], { duration:DUR * .6, fill:'forwards' });
    let done;
    if (st.mode === 'pill') {
      done = pill.animate([{ transform:'none' }, { transform:`translateY(${st.y - 44}px)` }], o).finished;
      pillBg.animate([{ opacity:.9 }, { opacity:1, offset:.6 }, { opacity:1, offset:.8 }, { opacity:0 }], { ...o, easing:'linear' });
      g('.g-logo').animate([{ transform:'none' }, { transform:HOME_LOGO }], o);
      g('.g-cart').animate([{ opacity:1 }, { opacity:1, offset:.8 }, { opacity:0 }], { ...o, easing:'linear' });
      g('.g-back').animate([{ opacity:1 }, { opacity:0, transform:'translateX(-14px)' }], out);
      g('.g-title').animate([{ opacity:1 }, { opacity:0, transform:'translateX(12px)' }], out);
      g('.g-search').animate([{ opacity:1 }, { opacity:0, transform:'scale(.6)' }], out);
    } else if (st.mode === 'sticky') {
      // 반대로: 요소가 먼저 빠지고 → 알약이 탭 영역 크기로 넓어진 뒤 → 흰색이 걷히며 홈의 고정 탭·띠배너가 드러남
      ITEMS.forEach(sel => g(sel).animate([{ opacity:1 }, { opacity:0, transform:'translateY(6px)' }], out));
      done = pillBg.animate([{ ...pillBox, opacity:.9, easing:EASE }, { ...stickyBg(st.h), opacity:1, offset:.72, boxShadow:'none', easing:'ease-in' },
        { ...stickyBg(st.h), opacity:0, boxShadow:'none' }], { duration:DUR * 1.1, fill:'forwards', easing:'linear' }).finished;
    } else {
      done = pill.animate([{ transform:'none', opacity:1 }, { transform:'translateY(-96px)', opacity:0 }],
        { duration:380, easing:'cubic-bezier(.5,0,.75,0)', fill:'forwards' }).finished;
    }
    done.then(() => { pdpNav.classList.remove('on'); clearAnims(pdpNav); });
  }

  // PDP 화면 전체를 "대표 이미지가 썸네일 자리에 오도록" 줄여 둔 상태 ↔ 원래 크기 (이미지와 페이지가 함께 커짐)
  const shrunk = (img, card) => {
    const k = card.w / img.w;
    return `translate(${card.x - img.x * k}px, ${card.y - img.y * k}px) scale(${k})`;
  };
  function openPdp() {
    if (busy || current === 'pdp') return; busy = true;
    const home = byId('home'), pdp = byId('pdp');
    const st = homeTopState(), from = cardRect();
    scrollOf('pdp').scrollTop = 0;
    const to = mainRect();
    pdp.style.zIndex = 2; home.style.zIndex = 1; pdp.classList.remove('hidden');
    pdp.style.transformOrigin = '0 0';
    const k = from.w / to.w;
    pdp.animate([
      { transform:shrunk(to, from), clipPath:inset(to, from.r / k) },
      { transform:'none', clipPath:inset(FULL, 0) }
    ], { duration:DUR, easing:EASE });
    heroMove(from, to, true).then(() => { home.classList.add('hidden'); busy = false; });
    gnbIn(st);
    current = 'pdp'; stack.push('home'); setTab('pdp');
  }
  function closePdp() {
    if (busy || current !== 'pdp') return; busy = true;
    const home = byId('home'), pdp = byId('pdp');
    home.classList.remove('hidden'); home.style.zIndex = 1; pdp.style.zIndex = 2;
    const st = homeTopState(), to = cardRect(), from = mainRect();
    pdp.style.transformOrigin = '0 0';
    const k = to.w / from.w;
    const anim = pdp.animate([
      { transform:'none', clipPath:inset(FULL, 0) },
      { transform:shrunk(from, to), clipPath:inset(from, to.r / k) }
    ], { duration:DUR, easing:EASE, fill:'forwards' });
    heroMove(from, to, false).then(() => { pdp.classList.add('hidden'); anim.cancel(); busy = false; });
    gnbOut(st);
    current = 'home'; stack.length = 0; setTab('home');
  }
  /* ---------- AI검색: 알약 버튼 ↔ 바텀시트 ----------
     열기: 왼쪽 AI 맞춤검색 알약이 제자리에서 위·오른쪽으로 늘어나 시트 몸통이 됨(알약 그라데이션이 번졌다 걷히며 연보라 시트 배경이 드러남)
           → 제목·추천 질문·입력창이 아래에서 차례로 올라옴
     닫기: 반대로 내용이 먼저 빠지고, 시트가 다시 알약 색으로 물들며 알약 자리로 오므라들어 버튼이 됨 */
  const ai = byId('ai'), aiMove = byId('aiMove'), aiBlob = byId('aiBlob'), aiBg = byId('aiBg');
  const aiInk = byId('aiInk'), aiIcon = byId('aiIcon'), aiBtn = byId('aiBtn');
  const aiItems = [...ai.querySelectorAll('.ai-c')];
  // 시트 안에서 본 AI검색 버튼 중심 = (187, 761 - 533.5). 시트 네 모서리까지 가장 먼 거리 ≈ 294px
  // 시트 기준 AI 맞춤검색 알약 = (17, 210.5) 117x52 → 시트 전체(375x278.5, 위 모서리 12)
  const AI_PILL = 'inset(210.5px 241px 16px 17px round 26px)';
  const AI_MID  = 'inset(70px 90px 4px 8px round 22px)';
  const AI_FULL = 'inset(0px 0px 0px 0px round 12px 12px 0px 0px)';
  const AI_OPEN = 460, AI_CLOSE = 380;   // 열기 .46s · 닫기 .38s
  let aiState = 'closed';

  function openAi() {
    if (busy || current !== 'home' || aiState !== 'closed') return;
    aiState = 'opening';
    clearAnims(ai);
    aiMove.style.transform = '';
    ai.classList.add('on');
    aiBtn.classList.add('gone');
    const t = { duration:AI_OPEN, easing:'linear', fill:'both' };
    // 원 모양 그대로 버튼 중심에서 퍼져 나감 (처음엔 천천히 → 빠르게 → 끝에서 부드럽게 멈춤). 그림자는 다 퍼진 뒤 서서히
    aiBlob.animate([
      { clipPath:AI_PILL, boxShadow:'0 0 8px 2px rgba(0,0,0,0)', easing:'cubic-bezier(.4,0,.2,1)' },
      { clipPath:AI_FULL, boxShadow:'0 0 8px 2px rgba(0,0,0,0)', offset:.86 },
      { clipPath:AI_FULL, boxShadow:'0 0 8px 2px rgba(0,0,0,.15)' }], t);
    // 보라색은 원이 퍼지는 동안 옅어지며 연보라 시트 배경으로 바뀜
    aiInk.animate([{ opacity:1 }, { opacity:1, offset:.18, easing:'cubic-bezier(.4,0,.4,1)' }, { opacity:0, offset:.8 }, { opacity:0 }], t);
    // 버튼 글자(AI검색)는 퍼지는 색 속으로 살짝 커지며 녹아듦
    aiIcon.animate([{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(-10px) scale(1.12)', offset:.3 }, { opacity:0 }], t);
    const last = aiItems.map((el, i) => el.animate(
      [{ opacity:0, transform:'translateY(18px)' }, { opacity:1, transform:'none' }],
      { duration:340, delay:AI_OPEN * .42 + i * 40, easing:'cubic-bezier(.2,.9,.3,1)', fill:'both' })).pop();
    last.finished.then(() => { if (aiState === 'opening') { aiState = 'open'; ai.classList.add('open'); } });
  }

  function closeAi(dragY = 0) {
    if (aiState !== 'open') return;
    aiState = 'closing';
    ai.classList.remove('open');
    const t = { duration:AI_CLOSE, delay:70, easing:'linear', fill:'both' };
    aiItems.slice().reverse().forEach((el, i) => el.animate(
      [{ opacity:1, transform:'none' }, { opacity:0, transform:'translateY(10px)' }],
      { duration:120, delay:i * 18, easing:'ease-in', fill:'forwards' }));
    aiMove.animate([{ transform:`translateY(${dragY}px)` }, { transform:'none' }], { ...t, easing:'cubic-bezier(.3,.7,.3,1)' });
    // 반대로: 보라색이 다시 번지며 원이 버튼 중심으로 모여듦
    aiBlob.animate([
      { clipPath:AI_FULL, boxShadow:'0 0 8px 2px rgba(0,0,0,.15)', easing:'cubic-bezier(.5,0,.75,0)' },
      { clipPath:AI_MID, boxShadow:'0 0 8px 2px rgba(0,0,0,0)', offset:.45, easing:'cubic-bezier(.2,.6,.3,1)' },
      { clipPath:AI_PILL, boxShadow:'0 0 8px 2px rgba(0,0,0,0)' }], t);
    aiInk.animate([{ opacity:0, easing:'ease-in' }, { opacity:1, offset:.6 }, { opacity:1 }], t);
    const end = aiIcon.animate([{ opacity:0, transform:'translateY(-10px) scale(1.12)' }, { opacity:0, transform:'translateY(-10px) scale(1.12)', offset:.66 }, { opacity:1, transform:'none' }], t);
    end.finished.then(() => {
      aiBtn.classList.remove('gone');
      ai.classList.remove('on');
      aiMove.style.transform = '';
      clearAnims(ai);
      aiState = 'closed';
      // 버튼으로 돌아온 뒤 말랑하게 한 번 튕김
      aiBtn.animate([{ transform:'scale(1)' }, { transform:'scale(1.06)' }, { transform:'scale(.98)' }, { transform:'scale(1)' }],
        { duration:380, easing:'ease-out' });
    });
  }

  // 핸들(시트 위쪽 28px)을 끌어내려 닫기
  (() => {
    const grab = byId('aiGrab');
    let y0 = null, dy = 0;
    const k = () => phone.getBoundingClientRect().height / 812;
    grab.addEventListener('pointerdown', e => {
      if (aiState !== 'open') return;
      y0 = e.clientY; dy = 0; grab.setPointerCapture(e.pointerId);
    });
    grab.addEventListener('pointermove', e => {
      if (y0 === null) return;
      const d = (e.clientY - y0) / k();
      dy = d > 0 ? d : d * .2;
      aiMove.style.transform = `translateY(${dy}px)`;
    });
    const up = () => {
      if (y0 === null) return; y0 = null;
      if (dy > 70) closeAi(dy);
      else aiMove.animate([{ transform:`translateY(${dy}px)` }, { transform:'none' }], { duration:260, easing:'cubic-bezier(.3,1.4,.5,1)' })
             .finished.then(() => { aiMove.style.transform = ''; });
      aiMove.style.transform = '';
    };
    grab.addEventListener('pointerup', up);
    grab.addEventListener('pointercancel', up);
  })();
  ai.querySelector('.ai-catch').addEventListener('click', () => closeAi());

  // AI 버튼 누르는 순간 살짝 눌림
  const aiHot = document.querySelector('.ai-hot');
  aiHot.addEventListener('pointerdown', () => aiBtn.classList.add('press'));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => aiHot.addEventListener(ev, () => aiBtn.classList.remove('press')));

  /* ---------- 홈 ↔ 나의11번가: GNB 알약이 이어지는 전환 ----------
     홈 GNB 알약이 보이면(스크롤 50 미만) 그 알약이 제자리(16,44)로 붙으며 나의11번가 GNB로 바뀜
       - 11번가 로고: 52px → 41.8px로 작아지며 오른쪽으로 비켜섬, 그 자리에 ← 뒤로가 들어옴
       - 검색창: 오른쪽 끝으로 오므라들며 검색 아이콘이 됨, "나의 11번가" 제목이 옆에서 들어옴
       - 알림·장바구니: 그대로 (알림만 2px 이동)
     알약이 안 보이면 GNB가 위에서 톡 내려옴. 화면은 흰 바탕이 아래에서 살짝 떠오르며 겹쳐짐 */
  const MY_DUR = 520, MY_EASE = 'cubic-bezier(.32,.72,0,1)';
  const myNav = byId('myNav');
  const mn = sel => myNav.querySelector(sel);
  const MY_LOGO_FROM = 'translate(-40.24px,-2.43px) scale(1.244)';   // 나의11번가 로고 41.8 @(56,17) ↔ 홈 로고 52 @(16,14.86)
  const homePill = () => { const hs = scrollOf('home').scrollTop; return hs < 50 ? hs : null; };

  function openMy() {
    if (busy || current !== 'home' || aiState !== 'closed') return; busy = true;
    const home = byId('home'), my = byId('my');
    const hs = homePill();
    scrollOf('my').scrollTop = 0;
    my.style.zIndex = 2; home.style.zIndex = 1; my.classList.remove('hidden');
    // 화면: 흰 화면이 아래에서 살짝 떠오르며 덮음 (홈은 제자리)
    my.animate([{ opacity:0 }, { opacity:1 }], { duration:MY_DUR * .4, easing:'ease-out' });   // 겹쳐 보이는 시간은 짧게
    my.querySelector('.scroll').animate([{ transform:'translateY(36px)' }, { transform:'none' }], { duration:MY_DUR, easing:MY_EASE });
    // GNB
    clearAnims(myNav); myNav.classList.add('on');
    const o = { duration:MY_DUR, easing:MY_EASE, fill:'both' };
    if (hs !== null) {
      myNav.animate([{ transform:`translateY(${-hs}px)` }, { transform:'none' }], o);
      mn('.mn-bg').animate([{ opacity:1 }, { opacity:.95 }], o);
      mn('.mn-logo').animate([{ transform:MY_LOGO_FROM }, { transform:'none' }], o);
      mn('.mn-hsearch').animate([{ opacity:1, transform:'none' }, { opacity:0, transform:'scaleX(.22)', offset:.7 }, { opacity:0, transform:'scaleX(.22)' }], o);
      mn('.mn-search').animate([{ opacity:0, transform:'scale(.6)' }, { opacity:1, transform:'none' }], { ...o, delay:140 });
      mn('.mn-back').animate([{ opacity:0, transform:'translateX(-14px)' }, { opacity:1, transform:'none' }], { ...o, delay:60 });
      mn('.mn-title').animate([{ opacity:0, transform:'translateX(16px)' }, { opacity:1, transform:'none' }], { ...o, delay:110 });
      mn('.mn-bc').animate([{ transform:'translateX(-2px)' }, { transform:'none' }], o);
    } else {
      myNav.animate([{ transform:'translateY(-100px)' }, { transform:'translateY(5px)', offset:.55 },
        { transform:'translateY(-2px)', offset:.78 }, { transform:'none' }],
        { duration:620, delay:60, easing:'cubic-bezier(.2,.7,.3,1)', fill:'both' });
    }
    setTimeout(() => { home.classList.add('hidden'); busy = false; }, MY_DUR + 40);
    current = 'my'; setTab('my');
  }

  function closeMy() {
    if (busy || current !== 'my') return; busy = true;
    const home = byId('home'), my = byId('my');
    home.classList.remove('hidden');
    const hs = homePill();
    my.style.zIndex = 2; home.style.zIndex = 1;
    const sc = my.querySelector('.scroll');
    my.animate([{ opacity:1 }, { opacity:1, offset:.25 }, { opacity:0 }], { duration:MY_DUR * .8, easing:'ease-in', fill:'forwards' });
    sc.animate([{ transform:'none' }, { transform:'translateY(28px)' }], { duration:MY_DUR * .8, easing:'cubic-bezier(.4,0,.8,.6)', fill:'forwards' });
    clearAnims(myNav);
    const o = { duration:MY_DUR, easing:MY_EASE, fill:'forwards' };
    let done;
    if (hs !== null) {
      done = myNav.animate([{ transform:'none' }, { transform:`translateY(${-hs}px)` }], o).finished;
      mn('.mn-bg').animate([{ opacity:.95 }, { opacity:1 }], o);
      mn('.mn-logo').animate([{ transform:'none' }, { transform:MY_LOGO_FROM }], o);
      mn('.mn-hsearch').animate([{ opacity:0, transform:'scaleX(.22)' }, { opacity:0, transform:'scaleX(.22)', offset:.15 }, { opacity:1, transform:'none' }], o);
      mn('.mn-search').animate([{ opacity:1 }, { opacity:0, transform:'scale(.6)', offset:.4 }, { opacity:0, transform:'scale(.6)' }], o);
      mn('.mn-back').animate([{ opacity:1 }, { opacity:0, transform:'translateX(-14px)', offset:.45 }, { opacity:0, transform:'translateX(-14px)' }], o);
      mn('.mn-title').animate([{ opacity:1 }, { opacity:0, transform:'translateX(16px)', offset:.45 }, { opacity:0, transform:'translateX(16px)' }], o);
      mn('.mn-bc').animate([{ transform:'none' }, { transform:'translateX(-2px)' }], o);
    } else {
      done = myNav.animate([{ transform:'none', opacity:1 }, { transform:'translateY(-100px)', opacity:0 }],
        { duration:360, easing:'cubic-bezier(.5,0,.75,0)', fill:'forwards' }).finished;
    }
    Promise.all([done, new Promise(r => setTimeout(r, MY_DUR * .8 + 20))]).then(() => {
      myNav.classList.remove('on'); clearAnims(myNav);
      my.classList.add('hidden'); clearAnims(my); busy = false;
    });
    current = 'home'; setTab('home');
  }

  function back() {
    if (aiState === 'open') closeAi();
    else if (current === 'my') closeMy();
    else closePdp();
  }

  document.addEventListener('click', e => {
    const h = e.target.closest('.hot'); if (!h) return;
    e.preventDefault();
    if ('ai' in h.dataset) openAi();
    else if (h.dataset.go === 'my') openMy();
    else if (h.dataset.push === 'pdp') openPdp();
    else if ('back' in h.dataset) back();
    else if ('top' in h.dataset) scrollOf(current).scrollTo({ top:0, behavior:'smooth' });
  });
  addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('debug');
    if (e.key === 'ArrowLeft' || e.key === 'Escape') back();
  });

  // 마우스 드래그 스크롤 (데스크톱 시연용)
  document.querySelectorAll('.scroll').forEach(el => {
    let y0 = null, s0 = 0, moved = false;
    el.addEventListener('mousedown', e => { y0 = e.clientY; s0 = el.scrollTop; moved = false; });
    addEventListener('mousemove', e => { if (y0 === null) return; const d = e.clientY - y0; if (Math.abs(d) > 4) moved = true; el.scrollTop = s0 - d / (phone.getBoundingClientRect().height / 812); });
    addEventListener('mouseup', () => { y0 = null; });
    el.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  });
})();
</script>
